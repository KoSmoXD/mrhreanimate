name: Animation Gallery Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.github/workflows/gallery-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.github/workflows/gallery-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: backend
      - name: Check syntax
        run: |
          node --check backend/server.js
          node --check backend/mocap.js
          node --check docs/mocap.js
          node --check docs/mocap-solver.js
          node --check docs/app.js
          node --check docs/make.js
          node --check docs/preview.js
          node --check backend/roblox-avatar.js
          node --input-type=module --check < docs/preview-avatar.js
      - name: Run gallery integration tests
        run: npm test
        working-directory: backend
