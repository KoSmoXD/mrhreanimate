name: Mr H Reanimate Luau Compile

on:
  push:
    branches: [main]
    paths:
      - 'Mr_H_Reanimate.lua'
      - 'ui/ui_changer.lua'
      - 'modules/MrH_CameraMotion.lua'
      - 'scripts/verify_reanimate_compiler.py'
      - '.github/workflows/reanimate-compile.yml'
  pull_request:
    paths:
      - 'Mr_H_Reanimate.lua'
      - 'scripts/verify_reanimate_compiler.py'
      - '.github/workflows/reanimate-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Mr H source
        uses: actions/checkout@v4
      - name: Checkout pinned Luau compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: 8387cfb461b38ce09e37c1e4c2811538ef1bf5cb
          path: .ci/luau
      - name: Build Luau CLI and compiler
        run: |
          cmake -S .ci/luau -B .ci/luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build .ci/luau-build --target Luau.Repl.CLI Luau.Compile.CLI --parallel 4
      - name: Reconstruct pinned patched engine
        run: |
          python3 scripts/verify_reanimate_compiler.py .ci
          .ci/luau-build/luau .ci/rewrite_verify.luau > .ci/patched_engine.luau
          test -s .ci/patched_engine.luau
      - name: Compile full patched engine
        run: |
          # Compile the actual distributed wrapper and its decoded source, not only the generated engine.
          .ci/luau-build/luau-compile Mr_H_Reanimate.lua > /dev/null
          .ci/luau-build/luau-compile .ci/published_decoded_loader.luau > /dev/null
          .ci/luau-build/luau-compile .ci/patched_engine.luau > /dev/null
          .ci/luau-build/luau-compile ui/ui_changer.lua > /dev/null
          .ci/luau-build/luau-compile modules/MrH_CameraMotion.lua > /dev/null
          echo "Three UI modes compiled (Original / Obsidian / Linoria)."
          echo "Patched upstream engine compiles within Luau register limits."
